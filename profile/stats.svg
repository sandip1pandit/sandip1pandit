<svg xmlns="http://www.w3.org/2000/svg" width="495" height="234" viewBox="0 0 495 234" role="img" aria-label="GitHub Statistics">
  <defs>
    <style>
      .card{fill:#ffffff;stroke:#d0d7de;stroke-width:1.2}
      .title{font:600 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#0969da}
      .label{font:14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#57606a}
      .value{font:600 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#1f2328}
      @media(prefers-color-scheme:dark){
        .card{fill:#0d1117;stroke:#30363d}
        .title{fill:#58a6ff}
        .label{fill:#8b949e}
        .value{fill:#e6edf3}
      }
    </style>
  </defs>
  <rect class="card" x="1" y="1" width="493" height="232" rx="10"/>
  <text class="title" x="28" y="39">GitHub Statistics</text>
  <text x="28" y="76" class="label">Public repositories</text><text x="467" y="76" text-anchor="end" class="value">13</text><text x="28" y="105" class="label">Followers</text><text x="467" y="105" text-anchor="end" class="value">4</text><text x="28" y="134" class="label">Following</text><text x="467" y="134" text-anchor="end" class="value">6</text><text x="28" y="163" class="label">Total stars earned</text><text x="467" y="163" text-anchor="end" class="value">0</text><text x="28" y="192" class="label">Total forks</text><text x="467" y="192" text-anchor="end" class="value">0</text>
  <text x="467" y="222" text-anchor="end" style="font:10px sans-serif;fill:#8b949e">Updated 2026-11-18</text>
</svg>