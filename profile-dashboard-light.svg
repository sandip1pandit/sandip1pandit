<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Sandip Pandit — light-mode animated developer dashboard</title>
<desc id="desc">A light terminal dashboard with an animated cyan point-cloud portrait, system information, skills, projects and links.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8fc"/><stop offset="1" stop-color="#eaf2f8"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00eaff"/><stop offset=".55" stop-color="#1686c4"/><stop offset="1" stop-color="#7455bd"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061d2b"/><stop offset="1" stop-color="#f4f9fd"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#b5d3df" stroke-opacity=".26"/></pattern>
  <pattern id="pixels" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#079fbd" opacity=".8"/></pattern>
  <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#079fbd" stroke-opacity=".15"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
  <clipPath id="portraitClip"><rect x="52" y="128" width="462" height="420" rx="12"/></clipPath>
  <clipPath id="person"><path d="M160 516 Q168 454 205 426 Q224 410 250 402 L250 378 Q230 357 224 322 Q215 282 224 239 Q231 174 285 166 Q344 166 352 238 Q360 282 347 326 Q341 358 320 378 L320 402 Q350 411 377 433 Q402 458 410 516Z"/><path d="M222 244 Q222 177 276 164 Q324 151 349 210 L354 252 Q338 227 319 218 Q281 205 242 239 L229 263Z"/></clipPath>
</defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/><rect width="1200" height="760" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="758" rx="23" fill="none" stroke="#08a9c7" stroke-width="2" opacity=".85"/>
<rect x="1" y="1" width="1198" height="758" rx="23" fill="none" stroke="#08a9c7" stroke-width="5" opacity=".22" filter="url(#soft)"/>
