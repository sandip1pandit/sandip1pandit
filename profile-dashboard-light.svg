  <path d="M52 130H514" stroke="#008da8" stroke-width="2" opacity=".9" filter="url(#glow)">
    <animate attributeName="d" values="M52 130H514;M52 546H514;M52 130H514" dur="4.8s" repeatCount="indefinite"/>
  </path>
  <rect x="52" y="128" width="462" height="420" fill="#08a9c7" opacity=".035">
    <animate attributeName="opacity" values=".015;.12;.015" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <ellipse cx="285" cy="338" rx="176" ry="190" fill="none" stroke="#08a9c7" stroke-opacity=".45" stroke-dasharray="3 9">
    <animate attributeName="stroke-opacity" values=".18;.65;.18" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</g>
