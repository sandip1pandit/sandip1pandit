<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Sandip Pandit — animated cyberpunk developer dashboard</title>
<desc id="desc">A neon terminal dashboard with an animated cyan point-cloud portrait, system information, skills, projects and links.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b12"/><stop offset="1" stop-color="#071a27"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00eaff"/><stop offset=".55" stop-color="#00a9ff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061d2b"/><stop offset="1" stop-color="#020811"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0b5265" stroke-opacity=".26"/></pattern>
  <pattern id="pixels" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#19dfff" opacity=".8"/></pattern>
  <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#62efff" stroke-opacity=".15"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
  <clipPath id="portraitClip"><rect x="52" y="128" width="462" height="420" rx="12"/></clipPath>
  <clipPath id="person">
    <path d="M168 514 Q180 426 235 400 L253 386 H316 L339 402 Q390 433 400 514Z"/>
    <path d="M229 250 Q229 166 285 164 Q345 166 347 250 L338 322 Q328 374 285 385 Q242 372 235 322Z"/>
    <path d="M235 245 Q244 178 290 178 Q329 178 343 238 Q326 216 308 213 Q273 207 244 235Z"/>
  </clipPath>
</defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/><rect width="1200" height="760" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="758" rx="23" fill="none" stroke="#00dfff" stroke-width="2" opacity=".85"/>
<rect x="1" y="1" width="1198" height="758" rx="23" fill="none" stroke="#00dfff" stroke-width="5" opacity=".22" filter="url(#soft)"/>
<path d="M24 54H1176" stroke="#14566b"/>
<circle cx="34" cy="28" r="7" fill="#ff5f57"/><circle cx="58" cy="28" r="7" fill="#febc2e"/><circle cx="82" cy="28" r="7" fill="#28c840"/>
