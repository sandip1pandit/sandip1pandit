  <path d="M235 402 L252 386 L265 426 L285 444 L307 426 L321 386 L339 402 L361 514 H207Z" fill="#062d40" stroke="#10cde9" stroke-width="2"/>
  <path d="M205 514 L228 447 L248 514 M365 514 L345 447 L326 514" fill="none" stroke="#087da0" stroke-width="2"/>
  <!-- Point-cloud texture clipped to the figure -->
  <rect x="150" y="155" width="290" height="370" fill="url(#pixels)" clip-path="url(#person)" opacity=".8"/>
  <rect x="52" y="128" width="462" height="420" fill="url(#scan)"/>
  <rect x="52" y="128" width="462" height="420" fill="#00dfff" opacity=".04">
    <animate attributeName="opacity" values=".02;.11;.02" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="52" y="128" width="462" height="26" fill="#00dfff" opacity=".12" filter="url(#soft)">
    <animate attributeName="y" values="128;520;128" dur="6s" repeatCount="indefinite"/>
  </rect>
  <path d="M52 170H514" stroke="#26eaff" stroke-width="1" opacity=".65">
    <animate attributeName="d" values="M52 170H514;M52 500H514;M52 170H514" dur="6s" repeatCount="indefinite"/>
  </path>
  <g fill="#23e8ff" filter="url(#glow)">
    <circle cx="155" cy="210" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
