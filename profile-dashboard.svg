  <path d="M281 293 L274 315 L290 318 M278 337 Q290 345 302 337" fill="none" stroke="#23cce9" stroke-width="2"/>
  <path d="M238 281 Q255 267 279 276 L278 300 Q255 305 239 294Z M292 276 Q315 267 333 281 L331 294 Q313 305 292 300Z" fill="none" stroke="#29dfff" stroke-width="3"/>
